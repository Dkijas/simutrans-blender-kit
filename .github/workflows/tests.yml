name: tests

# The full suite needs Blender, makeobj and a headless Simutrans, none of which a
# standard runner has. This job runs the Blender-free half - the `core` suite
# (~970 checks of pure-stdlib Python: projection, colours, the .dat linter, schema
# drift) plus the QA toolchain suites (sprite metrics, the per-direction, colour and
# consist checks, and the Quality Gate). All are pure stdlib, so they run on a bare
# runner and catch a regression in the geometry, the linter or the gate on every push.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The Pythons the supported Blenders actually ship: Blender 4.0 bundles 3.10,
      # 4.1+/5.x bundle 3.11. 3.12 is included as forward cover. The core code uses
      # PEP 604 (`str | None`) at runtime, so 3.10 is the real floor.
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Core + QA suites (Blender-free)
        run: >
          python tools/run_tests.py core scenecheck spritemetrics
          directioncheck colorcheck consistcheck qualitygate
